[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-email-triage-agent"
version = "0.1.0"
description = "Agentic Gmail triage with rule learning, drafting, and unsubscribe automation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
  { name = "Sai Ram Maruri" },
]
keywords = ["gmail", "email", "triage", "openai", "automation", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications :: Email",
  "Topic :: Office/Business",
]
dependencies = [
  "APScheduler>=3.10,<4.0",
  "google-api-python-client>=2.170.0",
  "google-auth>=2.35.0",
  "google-auth-oauthlib>=1.2.1",
  "openai>=1.30.0",
  "playwright>=1.52.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[project.scripts]
triage = "personal_email_triage.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["personal_email_triage*"]
